name: rosetta-fp
on: [workflow_dispatch]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dmd
        run: |
          curl -fsS https://dlang.org/d-keyring.gpg | gpg --import /dev/stdin
          curl -fsS https://dlang.org/install.sh -o install.sh
          bash install.sh -a dmd
      - name: Build probes
        run: |
          source ~/dlang/dmd-*/activate
          uname -m; sysctl -n sysctl.proc_translated || true
          dmd -O -release -of=probe_rel rosetta_fp.d
          dmd -g -debug -of=probe_dbg rosetta_fp.d
          PH=$(dirname $(which dmd))/../../src/phobos
          dmd -unittest -main -version=StdUnittest -O -release -of=random_ut $PH/std/random.d || echo "random_ut build failed"
      - name: Probe x87 vs libm vs sse
        run: |
          for m in x87 libm sse; do
            for i in 1 2 3; do ./probe_rel $m 60 & ./probe_dbg $m 60 & done
            wait
          done
      - name: Loop std.random unittest
        run: |
          test -x random_ut || exit 0
          fail=0
          for i in $(seq 1 40); do ./random_ut > out.txt 2>&1 || { fail=$((fail+1)); head -3 out.txt; }; done
          echo "std.random failures: $fail / 40"
