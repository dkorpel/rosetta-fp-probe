name: c-probe
on: [workflow_dispatch]
jobs:
  probe:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          clang -O2 -arch x86_64 -o probe_x86 fp_probe.c
          otool -tv probe_x86 | grep -cE "\sf(ild|ld|div|stp)" || true
      - name: x86_64 under Rosetta
        run: |
          for m in x87cmp x87pow pow; do for i in 1 2 3 4 5 6; do ./probe_x86 $m 90 & done; wait; done
